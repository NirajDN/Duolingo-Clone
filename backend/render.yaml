services:
  - type: web
    name: duolingo-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data && python manage.py ensure_superuser"
    startCommand: "gunicorn duolingo_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
