name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --max-time 60 "https://duolingo-clone-6092.onrender.com/api/health/" \
            && echo "Backend is awake." \
            || echo "Ping failed (server may be cold-starting). Will retry on next schedule."
